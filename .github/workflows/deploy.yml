name: Build and Deploy

# Build the images on GitHub's runners (fast, plenty of RAM), push them to GHCR,
# then have the 1 GB VM just pull + restart — it never builds anything itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/xerozzz/liquid-assets-backend
  FRONTEND_IMAGE: ghcr.io/xerozzz/liquid-assets-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          # VITE_API_URL must be blank in prod so the browser calls the API
          # same-origin through Caddy (and stays behind Basic Auth). See AGENTS.md.
          build-args: |
            VITE_API_URL=
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH in, pull the new images, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/liquid-assets
            # Refresh compose file / Caddyfile (these are used at runtime from the repo).
            git fetch --all
            git reset --hard origin/main
            # Pull the freshly built images (VM must be `docker login`ed to GHCR once).
            docker compose -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
