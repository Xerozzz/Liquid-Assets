services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liquid_assets
    volumes:
      - db_data:/var/lib/postgresql/data
    # Uncomment to expose Postgres on the host (e.g. for local backend dev).
    # ports:
    #   - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d liquid_assets']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/liquid_assets
      UPLOAD_DIR: /app/uploads
      SEED_ON_START: 'true'
    volumes:
      - images_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ''
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  db_data:
  images_data:
