services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-liquid_assets}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Uncomment to expose Postgres on the host (e.g. for local backend dev).
    # ports:
    #   - '5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-liquid_assets}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/liquid_assets}
      UPLOAD_DIR: /app/uploads
      SEED_ON_START: ${SEED_ON_START:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    volumes:
      - images_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback only: reachable as localhost:4000 from this machine (e.g. for the
      # documented local-frontend-dev workflow), but never from the network — the backend
      # must only be reachable through nginx (and its Basic Auth) on a real deployment.
      - '127.0.0.1:${PORT:-4000}:${PORT:-4000}'
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  db_data:
  images_data:
