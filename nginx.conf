server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6M;

  # Populated at container start by docker-entrypoint.d/90-basic-auth.sh — enables HTTP Basic
  # Auth for the whole app when BASIC_AUTH_USER/BASIC_AUTH_PASSWORD are set, no-op otherwise.
  include /etc/nginx/auth.conf;

  # Reverse-proxy API calls to the backend container.
  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback so client-side routes work on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
