server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6M;

  # Compress text assets — the JS bundle is ~1 MB uncompressed but ~300 KB gzipped,
  # a big win over higher-latency links. Caddy passes this through in prod.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  # Hashed build assets are immutable — let browsers cache them hard so repeat
  # visits skip re-downloading the bundle entirely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Populated at container start by docker-entrypoint.d/90-basic-auth.sh — enables HTTP Basic
  # Auth for the whole app when BASIC_AUTH_USER/BASIC_AUTH_PASSWORD are set, no-op otherwise.
  include /etc/nginx/auth.conf;

  # Reverse-proxy API calls to the backend container.
  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback so client-side routes work on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
